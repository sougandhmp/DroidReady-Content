name: Validate content

on:
  # No path filter: this check is required, so it must report on every pull request.
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  # The branch protection rule requires a check with this exact name.
  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the validator
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check the content against the app's structure
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 tools/validate_content.py --base-ref "$BASE"
      - name: Check the generated files are up to date
        run: python3 tools/build_index.py --check
